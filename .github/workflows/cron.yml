name: Automatic HWID Reset & Management

on:
  schedule:
    # Daily raat ko 12:00 AM (UTC) par automatic chalega
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual button enable karne ke liye

jobs:
  manage-hwid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run HWID Processing Script
        run: python reset_hwid.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "GitHub HWID Manager"
          git config --global user.email "bot@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto Managed HWID & Reset Dates" && git push)
