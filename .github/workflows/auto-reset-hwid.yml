name: Auto Reset HWID (30 Days)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-hwid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Reset HWIDs
        run: |
          import json
          from datetime import datetime

          FILE_PATH = 'users.json'
          RESET_DAYS = 30

          with open(FILE_PATH, 'r') as f:
              users = json.load(f)

          today = datetime.utcnow()
          today_str = today.strftime('%Y-%m-%d')
          changes_made = False

          print(f"📅 Checking on: {today_str}")

          for category in users:
              print(f"📁 {category}")
              for username, user_data in users[category].items():
                  hwid = user_data.get('hwid', '')
                  
                  if hwid == 'free':
                      print(f"  🆓 {username} - Free (skipped)")
                      continue
                  
                  if not hwid:
                      print(f"  ⚠️ {username} - No HWID (skipped)")
                      continue
                  
                  # Get set date (try both field names)
                  set_date_str = user_data.get('hwidsetdate', '') or user_data.get('hwidSetDate', '')
                  
                  if not set_date_str:
                      print(f"  📝 {username} - Setting date to {today_str}")
                      user_data['hwidsetdate'] = today_str
                      user_data['hwidresetdate'] = today_str
                      user_data['lastresetdate'] = today_str
                      changes_made = True
                      continue
                  
                  try:
                      set_date = datetime.strptime(set_date_str, '%Y-%m-%d')
                  except:
                      print(f"  ⚠️ {username} - Invalid date, setting to {today_str}")
                      user_data['hwidsetdate'] = today_str
                      user_data['hwidresetdate'] = today_str
                      user_data['lastresetdate'] = today_str
                      changes_made = True
                      continue
                  
                  days_diff = (today - set_date).days
                  print(f"  👤 {username} - {days_diff} days old")
                  
                  if days_diff >= RESET_DAYS:
                      print(f"  🔄 {username} - RESET!")
                      user_data['hwid'] = ''
                      user_data['hwidresetdate'] = today_str
                      user_data['lastresetdate'] = today_str
                      user_data['hwidsetdate'] = today_str
                      changes_made = True
                  else:
                      print(f"  ✅ {username} - {RESET_DAYS - days_diff} days left")
              print('')

          if changes_made:
              print('💾 Saving...')
              with open(FILE_PATH, 'w') as f:
                  json.dump(users, f, indent=2)
              print('✅ Saved!')

        shell: python3 {0}

      - name: Commit and push
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "GitHub Actions Bot"
            git config user.email "actions@github.com"
            git add users.json
            git commit -m "🔄 Auto-reset HWID $(date +'%Y-%m-%d')"
            git push
            echo "✅ Pushed!"
          else
            echo "✅ No changes"
          fi
