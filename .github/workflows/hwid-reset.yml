name: HWID Auto Reset

on:

  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  reset:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Script
        run: python scripts/hwid_reset.py

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add users.json

          if git diff --cached --quiet; then
            echo "No Changes"
          else
            git commit -m "Auto HWID Reset"
            git push
          fi
